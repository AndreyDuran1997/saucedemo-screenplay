serenity {
  project.name = "SauceDemo - Serenity Screenplay"
  # Captura de pantalla después de cada paso (se ven en el reporte)
  take.screenshots = AFTER_EACH_STEP
}

# false = ves el navegador mientras corre la prueba; true = corre oculto
headless.mode = false

webdriver {
  driver = chrome
  base.url = "https://www.saucedemo.com"

  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      # incognito evita la ventana de "cambia tu contraseña" de Chrome
      args = ["remote-allow-origins=*", "start-maximized", "incognito",
              "disable-infobars", "disable-gpu", "disable-extensions",
              "disable-dev-shm-usage", "disable-popup-blocking"]
    }
  }
}
