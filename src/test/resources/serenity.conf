serenity {
  project.name = "SauceDemo - Serenity Screenplay"
  # Captura de pantalla después de cada paso (se ven en el reporte)
  take.screenshots = AFTER_EACH_STEP
}

# false = ves el navegador; true = corre oculto (así corre en GitHub Actions)
headless.mode = false

webdriver {
  driver = chrome
  base.url = "https://www.saucedemo.com"

  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      args = ["remote-allow-origins=*", "start-maximized", "window-size=1920,1080",
              "incognito", "no-sandbox", "disable-infobars", "disable-gpu",
              "disable-extensions", "disable-dev-shm-usage", "disable-popup-blocking"]
    }
  }
}